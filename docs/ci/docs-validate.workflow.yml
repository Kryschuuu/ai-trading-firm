# =============================================================================
# CI-Workflow `docs-validate` (Task 12 / DC-08) — Docs-as-Code-Waechter.
#
# Verpflichtend fuer jeden PR (Basis-Level Security). Fuehrt Typecheck,
# Gesamttestsuite und `npm run docs:validate` aus. Der Validator prueft u. a.:
#   - Hilfe-Schema, relative Links, Viewer-Aufloesung, Markdown-Lint und Secrets,
#   - L1: dokumentierte Env-Flags haben echte, statisch aufloesbare Runtime-Reads
#     (inkl. Helper-/Konstanten-/Barrel- und dynamischer env[name]-Pfade),
#   - L2: Code→Doku Env-/Routen-Drift wird als begrenzte, nicht-blockierende
#     Warnung ausgegeben, damit neue Laufzeit-Oberflaechen sichtbar werden,
#   - L3: aktive Code-Version-Header entsprechen package.json; Dokument-Version
#     bleibt unabhaengig,
#   - Generierte Inventare (docs/generated/, DC-09) sind aktuell (Drift-Gate),
#   - L4: dokumentierte konkrete src/**-/scripts/**-Pfade und benannte Exporte
#     existieren; historische/Build-Referenzen haben begruendete Ausnahmen,
#   - Doku-Routen und Live-Gate-Zustaende bleiben gegen Code abgeglichen.
#
# Typecheck und Tests muessen vor den Doku-Aussagen sauber sein. Ein
# Spiegel-Sync-Schritt prueft, dass docs/ci/ und .github/workflows/ identisch
# bleiben. `npm test` startet fuer die DB-abhaengigen PAPER-Contract-Tests ein
# temporaeres Embedded-PostgreSQL; in CI ist dessen Verfuegbarkeit verpflichtend.
# Branch-Protection: Required Status Check ist exakt `docs-validate`.
#
# MERGE-BLOCKADE: In der Branch-Protection von `main` als Required Status
# Check `docs-validate` eintragen. Docs und Code werden im selben PR geaendert
# — nie auseinander mergen.
#
# QUELLE DER WAHRHEIT: Diese Datei ist die versionierte Quelle und wird 1:1
# nach .github/workflows/main.yml gespiegelt (Installation siehe docs/ci/README.md).
# =============================================================================
name: docs-validate

on:
  # push auf main (Post-Merge) und arena/** (Pre-PR-Validierung auf
  # Arbeitsbranches — siehe docs/ci/README.md, "Trigger und Pre-PR-Pruefung").
  push:
    branches: [main, 'arena/**']
  # Jeder PR, unabhaengig vom Ziel-Branch. Bewusst OHNE `paths`-Filter:
  # Ein Required Check, dessen Workflow wegen Path-Filterung gar nicht
  # laeuft, bleibt ewig "pending" und blockiert den Merge unloesbar.
  pull_request:
  # Manuelle Ausfuehrung zum Debuggen/Reproduzieren ohne neuen Commit.
  workflow_dispatch:

# Least privilege (siehe Audit SEC-10): Der Job liest nur das Repository und
# schreibt weder Commits noch Artefakte — read-only-Token genuegt.
permissions:
  contents: read

# Schnelle Folge-Pushes auf denselben Branch/PR: Nur der neueste Lauf zaehlt,
# veraltete Laeufe werden abgebrochen (spart Runner-Minuten; der juengere Run
# liefert den Required Check fuer den aktuellen Head-SHA).
concurrency:
  group: docs-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-validate:
    name: docs-validate
    runs-on: ubuntu-latest
    # npm test umfasst die gesamte Suite inkl. mehrerer temporärer DB-Starts;
    # das großzügigere Limit verhindert, dass langsame Runner den Gate-Check
    # mitten in einer gültigen Suite abbrechen.
    timeout-minutes: 30
    steps:
      # SEC-10 (Supply-Chain-Hardening): Alle Actions sind auf immutable
      # Commit-SHAs gepinnt; der Tag steht als Kommentar dahinter. Updates
      # rolliert Dependabot (.github/dependabot.yml) — nie per Tag-Referenz.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node 22 + npm-Cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Node 22 = LTS-Linie, gegen die entwickelt wird (@types/node 22).
          # Bewusst KEINE Versions-Matrix: Required Checks sollen deterministisch
          # auf genau einer Runtime laufen; Kompatibilitaetsstreuseltests waeren
          # ein separater, nicht-blockierender Job.
          node-version: 22
          # Cache fuer ~/.npm anhand des package-lock.json-Hashs — beschleunigt
          # `npm ci` bei Folge-Laeufen deutlich.
          cache: npm

      - name: Abhaengigkeiten (npm ci, exakt aus package-lock.json)
        # `npm ci` statt `npm install`: reproduzierbar, bricht bei Lockfile-Drift.
        run: npm ci

      - name: Spiegel-Sync pruefen (docs/ci == .github/workflows)
        # docs/ci/ ist die versionierte Quelle der Workflows; beide Kopien
        # muessen byte-identisch sein (docs/ci/README.md). Waere eine Seite
        # geaendert, liefen Tests gegen einen anderen Workflow als dokumentiert.
        run: |
          diff -u docs/ci/docs-validate.workflow.yml .github/workflows/main.yml
          diff -u docs/ci/security-live-gate.workflow.yml .github/workflows/security-live-gate.yml

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Gesamttestsuite (npm test)
        # Der Broker-Contract-Test startet selbst temporäres Embedded-PostgreSQL.
        # In CI muss die DB starten; nur lokale Offline-Läufe duerfen die beiden
        # PAPER-Tests ueberspringen, wenn die optionale Infrastruktur fehlt.
        env:
          BROKER_CONTRACTS_REQUIRE_DB: "true"
        run: npm test

      - name: Docs-Validierung (L1–L4, Links, Lint, Secrets, Konsistenz)
        run: npm run docs:validate

      - name: Generierte Inventare aktuell (docs/generated, DC-09)
        # Drift-Gate: Routen-/Env-/Schema-Inventar müssen dem Code entsprechen.
        # Bei Abweichung: `npm run docs:inventories` lokal ausführen und committen.
        run: npm run docs:inventories:check
