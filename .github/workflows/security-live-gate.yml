# =============================================================================
# CI-Workflow `security-live-gate` (Task 11) — merge-blockierend.
#
# Fuehrt die Security-Test-Suite des Live-Trading-Gates aus:
#   - vollstaendige Transitionsmatrix (9 Zustaende x 8 legale Uebergaenge,
#     alle illegalen Kombinationen abgelehnt),
#   - Enforcement-Matrix (9 States x Flags x Suite x Control Plane — nur die
#     exakt erlaubte Konstellation laesst eine Live-Order zu),
#   - Kill-Switch-Drill aus allen 9 Zustaenden inkl. Failsafe-Datei,
#   - Crash-/Persistenz- und Audit-Ketten-Integritaetstests,
#   - Red-Team-Regressionen (Bypass, Flag-Manipulation, Audit-Manipulation),
#   - Coverage-Tor: >= 95 % Zeilen auf src/live-gate/**
#     (Funktionendeckung wird berichtet; unter tsx zaehlen Phantom-Module
#     (CJS/ESM-Duplikate) in die Funktionenquote — Zeilen sind das Tor),
#   - keine echten Orders: alle Venue-Zugriffe laufen ueber Mock-Ports.
#
# MERGE-BLOCKADE: Der Job `security-live-gate` muss in der Branch-Protection
# von `main` als Required Status Check `security-live-gate` eingetragen werden
# (siehe docs/LIVE_TRADING.md, Abschnitt CI). Kein PR mit Live-Trading-Code
# wird gemerged, solange dieser Job nicht gruen ist.
#
# Nach gruener Suite schreibt der Job den Security-Suite-Stamp
# (data/live-gate/security-suite.json) und laedt ihn als Artefakt hoch —
# der Enforcer verlangt einen gueltigen Stamp vor jeder Live-Order.
#
# QUELLE DER WAHRHEIT: Diese Datei ist die versionierte Quelle und wird 1:1
# nach .github/workflows/security-live-gate.yml gespiegelt (Installation siehe
# docs/ci/README.md). Der Secret-Scanner prueft genau diese Pfade mit.
# =============================================================================
name: security-live-gate

on:
  # push auf main (Post-Merge) und arena/** (Pre-PR-Validierung auf
  # Arbeitsbranches — siehe docs/ci/README.md, "Trigger und Pre-PR-Pruefung").
  push:
    branches: [main, 'arena/**']
  # Jeder PR, unabhaengig vom Ziel-Branch. Bewusst OHNE `paths`-Filter:
  # Ein Required Check, dessen Workflow wegen Path-Filterung gar nicht
  # laeuft, bleibt ewig "pending" und blockiert den Merge unloesbar.
  pull_request:
  # Manuelle Ausfuehrung zum Debuggen/Reproduzieren ohne neuen Commit
  # (z. B. um einen Suite-Stamp fuer einen konkreten SHA zu erzeugen).
  workflow_dispatch:

# Least privilege (siehe Audit SEC-10): Es wird nur gelesen und genau ein
# Artefakt hochgeladen; dafuer reicht `contents: read` (Artefakte nutzen einen
# separaten Token-Scope, kein zusaetzliches Recht noetig).
permissions:
  contents: read

# Schnelle Folge-Pushes auf denselben Branch/PR: Nur der neueste Lauf zaehlt,
# veraltete Laeufe werden abgebrochen (der juengere Run liefert den Required
# Check fuer den aktuellen Head-SHA; ein abgebrochener Lauf schreibt nie
# einen Suite-Stamp, da der Stamp erst am Ende einer gruene Suite erzeugt wird).
concurrency:
  group: security-live-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # SEC-03: Windows-Pfadsemantik und nativer AVIF-Decoder muessen ebenfalls
  # gepatcht sein. Keine DB/Orders; die isolierte Suite ist plattformneutral
  # und laeuft deshalb cheap und parallel zum Linux-Job vorab.
  # ---------------------------------------------------------------------------
  security-next-windows:
    name: security-next-windows
    runs-on: windows-latest
    # Puffer fuer kalten npm-Cache unter Windows (Registry-Downloads sind dort
    # erfahrungsgemaess langsamer); Tests selbst dauern < 1 min.
    timeout-minutes: 15
    steps:
      # SEC-10: Alle Actions auf immutable Commit-SHAs gepinnt (Tag im
      # Kommentar); Updates via Dependabot (.github/dependabot.yml).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node 22 + npm-Cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Gleiche LTS-Linie wie der Linux-Job — nur so ist der
          # Plattform-Vergleich aussagekraeftig (eine Variable gleichzeitig).
          node-version: 22
          cache: npm

      - name: Abhaengigkeiten (npm ci, exakt aus package-lock.json)
        run: npm ci

      - name: Next-Dependency- und Framework-Regressionen (Windows)
        # Prueft installierte Next-Version, Lockfile-Eintraege und den
        # geladenen nativen Decoder (sharp/libheif) — siehe SEC-03-Finding.
        run: npm run test:security:next

  # ---------------------------------------------------------------------------
  # Required Check: baut, prueft Auth-/Next-Regressionen unter Linux und
  # laesst die Live-Gate-Suite mit Coverage-Tor laufen. Haengt am Windows-Job:
  # Kein gruener Required Check / Suite-Stamp bei roter Windows-Regression.
  # ---------------------------------------------------------------------------
  security-live-gate:
    name: security-live-gate
    needs: security-next-windows
    # Abhaengige Jobs werden bei Fehlern nur SKIPPED — ein Required Check darf
    # aber nie still uebersprungen werden. Deshalb: immer laufen und im ersten
    # Schritt explizit fail-closed abbrechen, wenn Windows nicht gruen war.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Dummy-Ziele: Die Suite nutzt Mock-Ports, es gehen keine echten Orders
      # oder DB-Verbindungen raus. Die Env-Variablen muessen nur gesetzt sein.
      DATABASE_URL: postgresql://test:test@0.0.0.0:5432/test
      STARTING_EQUITY: "10000"
    steps:
      - name: Windows-Security-Pruefung muss erfolgreich sein
        # Fail-Closed-Gate (bewusst vor jedem anderen Schritt): Der Windows-Job
        # kann auch CANCELLED sein (z. B. durch concurrency) — alles ausser
        # 'success' ist rot, niemals gelb/uebersprungen.
        if: ${{ needs.security-next-windows.result != 'success' }}
        run: |
          echo "::error::Windows-Security-Pruefung nicht erfolgreich; kein Suite-Stamp."
          exit 1

      # SEC-10: Alle Actions auf immutable Commit-SHAs gepinnt (Tag im
      # Kommentar); Updates via Dependabot (.github/dependabot.yml).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node 22 + npm-Cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Abhaengigkeiten (npm ci, exakt aus package-lock.json)
        run: npm ci

      - name: Dependency-Audit (fail-closed ab Security-Level high)
        # Supply-Chain-Gate: schlaegt bei high/critical Advisories in den
        # INSTALLIERTEN Abhaengigkeiten an — inkl. Dev-Abhaengigkeiten, da
        # Build-Tools (esbuild, tailwind, postcss) direkt in die ausgelieferten
        # Bundles einflieszen. Baseline aktuell: 0 Funde (2026-09-06).
        run: npm audit --audit-level=high

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Produktions-Build mit gepatchtem Next.js
        # Der Build ist Pflicht vor dem Suite-Stamp: Nur so stellt sich heraus,
        # dass die gepatchte Next-Version tatsaechlich baut (nicht nur testet).
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          SCHEDULER_ENABLED: "false"

      - name: Next-/Auth-Regressionen und Live-Gate-Suite (Coverage >= 95 %)
        # Reihenfolge: Next-Regressionen -> Auth-Regressionen (SEC-01) ->
        # Live-Gate-Suite mit Zeilen-Coverage-Tor >= 95 % auf src/live-gate/**.
        run: npm run security:live-gate

      - name: Secret-Scan (Quellcode-Muster)
        # Scannt Live-Gate-Code, -Tests und genau diese Workflow-Dateien auf
        # Secret-Muster — auch die CI selbst darf nie Credentials enthalten.
        run: node --import tsx scripts/scan-live-gate-secrets.ts

      - name: Security-Suite-Stamp schreiben (Deployment-Artefakt)
        # runId + SHA machen den Stamp eindeutig und revisionierbar; der
        # Enforcer prueft Alter (<= LIVE_GATE_SUITE_MAX_AGE_MS) und passed:true.
        run: |
          node --import tsx scripts/live-security-stamp.ts \
            --run-id="gha-${{ github.run_id }}-${{ github.run_attempt }}" \
            --sha="${{ github.sha }}" \
            --source=ci

      - name: Suite-Stamp als Artefakt hochladen
        # Deployment-Artefakt fuer die Auslieferung (90 Tage Rueckgriff fuer
        # Audits); fehlt die Datei, schlaegt der Schritt bewusst hart (error).
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-gate-security-suite
          path: data/live-gate/security-suite.json
          if-no-files-found: error
          retention-days: 90
