#
# Ollama im LAN freigeben — NUR für Variante B (Split-Node) auf dem DESKTOP nötig.
#
# Installation auf dem Desktop:
#   sudo mkdir -p /etc/systemd/system/ollama.service.d
#   sudo cp deploy/ollama-lan.conf /etc/systemd/system/ollama.service.d/override.conf
#   sudo systemctl daemon-reload
#   sudo systemctl restart ollama
#
# Prüfen:
#   ss -tlnp | grep 11434        # muss 0.0.0.0:11434 zeigen
#
# WICHTIG: Ollama hat KEINE Authentifizierung. Gib den Port ausschließlich
# für die IP des N150 frei:
#   sudo ufw allow from 192.168.1.42 to any port 11434
#
[Service]
# Auf allen Netzwerkschnittstellen lauschen statt nur auf 127.0.0.1
Environment="OLLAMA_HOST=0.0.0.0:11434"

# Modelle nach Gebrauch 30 Minuten im RAM halten. Das ist in Variante B der
# größte Einzelgewinn: spart pro Agentenwechsel 10-30 s Ladezeit.
Environment="OLLAMA_KEEP_ALIVE=30m"

# Wie viele Modelle gleichzeitig im Speicher liegen dürfen.
# 48 GB RAM: 2 ist bequem (z. B. ein 14B für den CEO + ein 7B für den Rest).
# 16 GB RAM: unbedingt auf 1 setzen.
Environment="OLLAMA_MAX_LOADED_MODELS=2"

# Wie viele Anfragen parallel bearbeitet werden. Bewusst auf 1: die Pipeline ist
# ohnehin sequenziell, und parallele Anfragen konkurrieren nur um Bandbreite.
Environment="OLLAMA_NUM_PARALLEL=1"

# Nur relevant, falls du es doch mit ROCm auf der RX 480 versuchen willst.
# Erwartung: funktioniert bei gfx803 in aller Regel NICHT — der unterstützte Weg
# ist llama.cpp mit Vulkan (siehe docs/INSTALL.md, Kapitel 8.3).
# Environment="HSA_OVERRIDE_GFX_VERSION=8.0.3"
